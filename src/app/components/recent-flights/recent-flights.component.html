<div class="bg-white rounded-lg shadow-sm border border-gray-200">
  <!-- Header -->
  <div class="flex items-center justify-between p-6 border-b border-gray-200">
    <h2 class="text-lg font-semibold text-gray-900">Recent Flight Assignments</h2>
    <a href="#" class="text-blue-600 hover:text-blue-700 text-sm font-medium">View All</a>
  </div>

  <!-- Table -->
  <div class="overflow-x-auto">
    <table class="w-full">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Flight Code</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Employee</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Route</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Travel Date</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let flight of flightAssignments">
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ flight.flightCode }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ flight.employee }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ flight.route }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ flight.travelDate }}</td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full" [class]="flight.statusColor">
              {{ flight.status }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
