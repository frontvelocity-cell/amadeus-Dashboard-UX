<div class="bg-white rounded-lg p-6 shadow-sm border border-gray-200">
  <h2 class="text-lg font-semibold text-gray-900 mb-6">Quick Actions</h2>
  
  <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4">
    <button *ngFor="let action of actions" 
            class="p-6 rounded-lg transition-colors duration-200 text-left" 
            [class]="action.bgColor">
      <div class="flex items-center space-x-3">
        <div class="w-6 h-6 bg-gray-400 rounded"></div>
        <span class="font-medium" [class]="action.textColor">{{ action.title }}</span>
      </div>
    </button>
  </div>
</div>
