<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
  <div *ngFor="let stat of stats" class="bg-white rounded-lg p-6 shadow-sm border border-gray-200">
    <div class="flex items-start space-x-4">
      <!-- Icon -->
      <div class="w-14 h-14 rounded-lg flex items-center justify-center" [class]="stat.iconBg">
        <div class="w-6 h-6 bg-gray-400 rounded"></div>
      </div>

      <!-- Content -->
      <div class="flex-1">
        <h3 class="text-2xl font-bold mb-1" [class]="stat.textColor">{{ stat.value }}</h3>
        <p class="text-gray-900 font-medium mb-1">{{ stat.title }}</p>
        <p class="text-sm text-gray-600">{{ stat.description }}</p>
      </div>
    </div>
  </div>
</div>
