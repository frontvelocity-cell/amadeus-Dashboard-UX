<header class="bg-white border-b border-gray-200 h-18">
  <div class="flex items-center justify-between px-6 py-4">
    <!-- Brand -->
    <div class="flex items-center">
      <div class="flex items-center space-x-3">
        <div class="w-32 h-5 bg-gray-300 rounded flex items-center justify-center text-xs text-gray-600">
          AMADEUS LOGO
        </div>
      </div>
    </div>

    <!-- Profile Area -->
    <div class="flex items-center space-x-4">
      <!-- Notifications -->
      <button class="p-2 text-gray-600 hover:text-gray-900">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
        </svg>
      </button>

      <!-- Profile -->
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 bg-blue-600 rounded-full flex items-center justify-center">
          <span class="text-white text-sm font-medium">AT</span>
        </div>
        <div class="flex flex-col">
          <span class="text-sm font-medium text-gray-900">{{ profileName }}</span>
          <span class="text-xs text-gray-600">{{ profileRole }}</span>
        </div>
        <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
      </div>
    </div>
  </div>
</header>
