<header class="fixed top-0 left-0 right-0 bg-white border-b border-gray-200 shadow-sm z-50 h-16">
  <div class="flex items-center justify-between h-full px-6">
    <!-- Brand Section -->
    <div class="flex items-center">
      <!-- Use actual logo when available, fallback to placeholder -->
      <img src="assets/amadeus-logo.svg" alt="Amadeus Logo" class="h-5" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="w-32 h-5 bg-gray-300 rounded items-center justify-center text-xs text-gray-600 hidden">
        AMADEUS LOGO
      </div>
    </div>
    
    <!-- Right Side Actions -->
    <div class="flex items-center space-x-4">
      <!-- Notifications Button -->
      <button class="p-2 text-gray-600 hover:text-gray-900 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
        </svg>
      </button>
      
      <!-- Profile Area -->
      <div class="flex items-center space-x-3">
        <!-- Avatar -->
        <div class="w-9 h-9 bg-blue-600 rounded-full flex items-center justify-center">
          <span class="text-white text-sm font-medium">AT</span>
        </div>
        
        <!-- Profile Info - Hidden on small screens -->
        <div class="hidden md:block">
          <div class="text-sm font-medium text-gray-900">{{ profileName }}</div>
          <div class="text-xs text-gray-600">{{ profileRole }}</div>
        </div>
        
        <!-- Dropdown Arrow -->
        <svg class="w-4 h-4 text-gray-600 transition-transform hover:text-gray-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </div>
    </div>
  </div>
</header>
