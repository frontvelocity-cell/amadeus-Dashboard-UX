<aside class="fixed left-0 top-16 w-64 h-full bg-white shadow-sm border-r border-gray-200 overflow-y-auto">
  <nav class="p-4">
    <!-- Main Menu -->
    <div class="space-y-2">
      <div *ngFor="let item of menuItems" class="">
        <!-- Regular Menu Item (no children) -->
        <div *ngIf="!item.children" 
             class="flex items-center justify-between p-3 rounded-lg transition-colors cursor-pointer"
             [class.bg-blue-100]="item.isActive || item.active"
             [class.hover:bg-gray-50]="!(item.isActive || item.active)"
             [routerLink]="item.route"
             routerLinkActive="bg-blue-100">
          <div class="flex items-center space-x-3">
            <div class="w-6 h-6 text-blue-900">
              <!-- Dynamic SVG icons based on item.icon -->
              <svg *ngIf="item.icon === 'home'" fill="currentColor" viewBox="0 0 24 24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
              </svg>
              <svg *ngIf="item.icon === 'work'" fill="currentColor" viewBox="0 0 24 24">
                <path d="M20 6h-2.5l-1.1-1.4C16.1 4.2 15.7 4 15.2 4H8.8c-.5 0-.9.2-1.2.6L6.5 6H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/>
              </svg>
              <svg *ngIf="item.icon === 'flight'" fill="currentColor" viewBox="0 0 24 24">
                <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
              </svg>
              <svg *ngIf="item.icon === 'admin'" fill="currentColor" viewBox="0 0 24 24">
                <path d="M17 11c.34 0 .67.04 1 .09V6.27L10.5 3L3 6.27v4.91c0 4.54 3.2 8.79 7.5 9.82.55-.13 1.08-.32 1.6-.55-.69-.98-1.1-2.17-1.1-3.45 0-3.31 2.69-6 6-6z"/>
                <path d="M17 13c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm-1.5 6l-1.41-1.41L15.5 16l1.41 1.41L18.5 16l1.41 1.41L18.5 19z"/>
              </svg>
              <svg *ngIf="item.icon === 'group'" fill="currentColor" viewBox="0 0 24 24">
                <path d="M16 4c0-1.11.89-2 2-2s2 .89 2 2-.89 2-2 2-2-.89-2-2zm4 18v-6h2.5l-2.54-7.63A3 3 0 0 0 17.06 7H14.94c-1.4 0-2.67.93-3.06 2.37L9.34 17H12v6h8zM12.5 11.5c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5S11 9.17 11 10s.67 1.5 1.5 1.5zM5.5 6c1.11 0 2-.89 2-2s-.89-2-2-2-2 .89-2 2 .89 2 2 2zm2.5 16v-7H6l1.96-6.76A2 2 0 0 0 6.07 6H3.93a2 2 0 0 0-1.89 2.24L4 15H2v7h6z"/>
              </svg>
              <!-- Fallback placeholder for items without specific icons -->
              <div *ngIf="!item.icon" class="w-full h-full bg-gray-300 rounded"></div>
            </div>
            <span class="text-sm font-medium text-blue-900">{{ item.label }}</span>
          </div>
          <svg class="w-4 h-4 text-blue-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
          </svg>
        </div>
        
        <!-- Expandable Menu Item (with children) -->
        <div *ngIf="item.children">
          <div class="flex items-center justify-between p-3 rounded-lg cursor-pointer transition-colors"
               [class.bg-blue-50]="item.active"
               [class.hover:bg-gray-50]="!item.active"
               (click)="toggleExpanded(item.label)">
            <div class="flex items-center space-x-3">
              <div class="w-6 h-6 text-blue-900">
                <!-- Dynamic SVG icons for parent items with children -->
                <svg *ngIf="item.icon === 'group'" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M16 4c0-1.11.89-2 2-2s2 .89 2 2-.89 2-2 2-2-.89-2-2zm4 18v-6h2.5l-2.54-7.63A3 3 0 0 0 17.06 7H14.94c-1.4 0-2.67.93-3.06 2.37L9.34 17H12v6h8zM12.5 11.5c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5S11 9.17 11 10s.67 1.5 1.5 1.5zM5.5 6c1.11 0 2-.89 2-2s-.89-2-2-2-2 .89-2 2 .89 2 2 2zm2.5 16v-7H6l1.96-6.76A2 2 0 0 0 6.07 6H3.93a2 2 0 0 0-1.89 2.24L4 15H2v7h6z"/>
                </svg>
                <!-- Fallback placeholder for parent items without specific icons -->
                <div *ngIf="!item.icon" class="w-full h-full bg-gray-300 rounded"></div>
              </div>
              <span class="text-sm font-medium"
                    [class.text-blue-900]="item.active"
                    [class.text-gray-700]="!item.active">
                {{ item.label }}
              </span>
            </div>
            <svg class="w-4 h-4 text-blue-900 transition-transform"
                 [class.rotate-90]="isExpanded(item.label)"
                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
          </div>
          
          <!-- Sub Menu Items -->
          <div *ngIf="isExpanded(item.label)" class="ml-8 mt-2 space-y-1">
            <a *ngFor="let child of item.children"
               [routerLink]="child.route"
               routerLinkActive="bg-gray-100"
               class="block p-2 text-sm text-blue-900 rounded hover:bg-gray-50 cursor-pointer">
              {{ child.label }}
            </a>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Logout Section -->
    <div class="mt-auto pt-8">
      <button class="flex items-center space-x-3 p-3 w-full text-left rounded-lg hover:bg-red-50 transition-colors cursor-pointer">
        <div class="w-6 h-6 text-red-600">
          <svg fill="currentColor" viewBox="0 0 24 24">
            <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.59L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
          </svg>
        </div>
        <span class="text-sm font-medium text-red-600">Logout Account</span>
      </button>
    </div>
  </nav>
</aside>
