<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="max-w-md w-full text-center">
    <!-- Large decorative 404 number -->
    <div class="mb-8">
      <h1 class="text-9xl font-bold text-gray-300">404</h1>
    </div>
    
    <!-- Optional decorative icon - can be toggled via CSS or removed if not needed -->
    <div class="w-64 h-64 mx-auto mb-8 hidden">
      <svg class="w-full h-full text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 12h6m-6-4h6m2 5.291A7.962 7.962 0 0112 15c-2.34 0-4.47-.881-6.08-2.33M15 17H9v-2.5A6.5 6.5 0 0115.5 8a6.5 6.5 0 016.5 6.5V17z"></path>
      </svg>
    </div>
    
    <!-- Main heading and description -->
    <h2 class="text-3xl font-bold text-gray-900 mb-4">Page Not Found</h2>
    <p class="text-gray-600 mb-8">
      The page you are looking for doesn't exist or has been moved.
    </p>
    
    <!-- Action buttons -->
    <div class="space-y-4">
      <!-- Primary action button with icon -->
      <a routerLink="/dashboard" 
         class="inline-flex items-center justify-center px-6 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        Back to Dashboard
      </a>
      
      <!-- Secondary action button -->
      <div>
        <button onclick="history.back()" 
                class="text-blue-600 hover:text-blue-800 underline focus:outline-none focus:ring-2 focus:ring-blue-500 rounded">
          Go Back
        </button>
      </div>
    </div>
  </div>
</div>
