<div class="p-6">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Manager Management</h1>
    <p class="text-gray-600 mt-2">Manage all managers and their teams</p>
  </div>

  <div class="bg-white rounded-lg shadow-sm">
    <div class="p-6 border-b border-gray-200">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-semibold text-gray-900">All Managers</h2>
        <button class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">Add Manager</button>
      </div>
    </div>
    
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead class="bg-purple-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">Manager ID</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">Name</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">Department</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">Team</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">Employees</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">Actions</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr *ngFor="let manager of managers">
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ manager.id }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ manager.name }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ manager.department }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ manager.team }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ manager.employees }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
              <button class="text-blue-600 hover:text-blue-900 mr-3">View Team</button>
              <button class="text-green-600 hover:text-green-900 mr-3">Edit</button>
              <button class="text-red-600 hover:text-red-900">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
