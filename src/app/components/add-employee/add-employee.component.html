<div class="p-6">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Add New Employee</h1>
    <p class="text-gray-600 mt-2">Create a new employee record</p>
  </div>

  <div class="bg-white rounded-lg shadow-sm p-6">
    <form (ngSubmit)="onSubmit()" #employeeForm="ngForm">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
          <input type="text" 
                 [(ngModel)]="employee.name" 
                 name="name"
                 required
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
          <input type="email" 
                 [(ngModel)]="employee.email" 
                 name="email"
                 required
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Designation</label>
          <select [(ngModel)]="employee.designation" 
                  name="designation"
                  required
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <option value="">Select Designation</option>
            <option *ngFor="let designation of designations" [value]="designation">{{ designation }}</option>
          </select>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Department</label>
          <select [(ngModel)]="employee.department" 
                  name="department"
                  required
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <option value="">Select Department</option>
            <option *ngFor="let department of departments" [value]="department">{{ department }}</option>
          </select>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Phone</label>
          <input type="tel" 
                 [(ngModel)]="employee.phone" 
                 name="phone"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Address</label>
          <textarea [(ngModel)]="employee.address" 
                    name="address"
                    rows="3"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
        </div>
      </div>
      
      <div class="flex justify-end space-x-4 mt-6">
        <a routerLink="/employees" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">Cancel</a>
        <button type="submit" 
                [disabled]="!employeeForm.form.valid"
                class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50">
          Add Employee
        </button>
      </div>
    </form>
  </div>
</div>
