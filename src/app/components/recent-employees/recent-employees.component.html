<div class="bg-white rounded-lg shadow-sm border border-gray-200">
  <!-- Header -->
  <div class="flex items-center justify-between p-6 border-b border-gray-200">
    <h2 class="text-lg font-semibold text-gray-900">Recent Employees</h2>
    <a href="#" class="text-blue-600 hover:text-blue-700 text-sm font-medium">View All</a>
  </div>

  <!-- Table -->
  <div class="overflow-x-auto">
    <table class="w-full">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Employee ID</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Designation</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Department</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let employee of employees">
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ employee.id }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ employee.name }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ employee.designation }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ employee.department }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
